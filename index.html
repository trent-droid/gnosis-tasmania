          <h2>About Gnosis Tasmania</h2>
          <p>Gnosis Tasmania is a genuine local study group in Hobart and Launceston, Tasmania, teaching in the tradition of Samael Aun Weor (1917&ndash;1977). We are part of the worldwide network of affiliated Gnostic study groups, connected to Gnosis Australia and the broader Gnostic Society Samael Aun Weor.</p>
          <p>Our community meets weekly for donation-based classes in meditation, self-knowledge, the Three Factors of the Revolution of Consciousness, Kabbalah, dream yoga, and inner alchemy. Classes are open to everyone &mdash; no belief system, prior knowledge, or commitment is required.</p>

          <h2>Our Courses</h2>
          <p><strong>Introduction to Gnosis</strong> &mdash; A 34-session foundational course covering consciousness, psychology, cosmology, Kabbalah, meditation, dream yoga, and the practical methods of inner transformation. Weekly classes in both Hobart and Launceston.</p>
          <p><strong>Meditation Classes</strong> &mdash; Ongoing weekly practical classes in Gnostic meditation: relaxation, concentration, meditation, and samadhi. All levels welcome.</p>

          <h2>The Three Factors of the Revolution of Consciousness</h2>
          <p>The central teaching of the contemporary Gnostic tradition, as synthesised by Samael Aun Weor: (1) <strong>Psychological Death</strong> &mdash; the dissolution of the ego through self-observation; (2) <strong>Second Birth</strong> &mdash; the emergence of the soul as the false self diminishes; (3) <strong>Sacrifice for Humanity</strong> &mdash; living in compassionate service to others.</p>
